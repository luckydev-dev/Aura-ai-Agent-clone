name: Sync Aura AI Agent

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: aura-ai-agent-sync
  cancel-in-progress: false

jobs:
  sync-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Clone source repository
        run: |
          set -euo pipefail
          rm -rf /tmp/Aura-Ai-Agent
          git clone --depth 1 https://github.com/luckydev-dev/Aura-Ai-Agent.git /tmp/Aura-Ai-Agent

      - name: Copy source files but preserve destination workflow
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/main.yml' \
            --exclude='.github/workflows/' \
            /tmp/Aura-Ai-Agent/ ./

      - name: Commit and push changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "Source is already up to date; no commit needed."
            exit 0
          fi

          git commit -m "Sync Aura-Ai-Agent source"
          git push origin HEAD:main
