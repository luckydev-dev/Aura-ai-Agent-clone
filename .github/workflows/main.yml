name: Sync Aura AI Agent

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: aura-ai-agent-sync
  cancel-in-progress: false

jobs:
  sync-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout upstream source without overwriting clone
        run: |
          set -euo pipefail
          echo "This clone is now maintained independently; source sync is intentionally disabled."

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "Source is already up to date; no commit needed."
            exit 0
          fi

          git commit -m "Sync Aura-Ai-Agent source"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/luckydev-dev/Aura-ai-Agent-clone.git" HEAD:main
