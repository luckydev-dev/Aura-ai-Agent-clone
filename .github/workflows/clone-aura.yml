name: Clone Aura Repository

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Source branch to clone"
        required: true
        default: "main"
        type: string

permissions:
  contents: write

concurrency:
  group: clone-aura
  cancel-in-progress: false

jobs:
  clone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source repository and replace files
        env:
          SOURCE_REPO: https://github.com/luckydev-dev/Aura-Ai-Agent.git
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          git clone --depth 1 --branch "$SOURCE_BRANCH" "$SOURCE_REPO" "$work/source"

          # Keep this workflow so the clone action remains available after sync.
          mkdir -p "$work/preserved-workflow"
          cp .github/workflows/clone-aura.yml "$work/preserved-workflow/clone-aura.yml"

          # Remove tracked and untracked project files, but preserve .git and the workflow.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf -- {} +
          find .github -mindepth 1 -maxdepth 1 ! -name workflows -exec rm -rf -- {} + 2>/dev/null || true
          find .github/workflows -mindepth 1 -maxdepth 1 ! -name clone-aura.yml -exec rm -rf -- {} + 2>/dev/null || true

          # Copy the complete source working tree and preserve the clone action.
          cp -a "$work/source/." .
          mkdir -p .github/workflows
          cp "$work/preserved-workflow/clone-aura.yml" .github/workflows/clone-aura.yml

      - name: Commit and push cloned files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Repository is already synchronized."
            exit 0
          fi
          git commit -m "Sync files from Aura-Ai-Agent"
          git push
