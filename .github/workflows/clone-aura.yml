name: Clone Aura Repository

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Source branch to clone"
        required: true
        default: "main"
        type: string

permissions:
  contents: write

concurrency:
  group: clone-aura
  cancel-in-progress: false

jobs:
  clone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Replace working files with source repository
        env:
          SOURCE_REPO: https://github.com/luckydev-dev/Aura-Ai-Agent.git
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          git clone --depth 1 --branch "$SOURCE_BRANCH" "$SOURCE_REPO" "$work/source"

          # Save this workflow outside the tree before replacing files.
          cp .github/workflows/clone-aura.yml "$work/clone-aura.yml"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf -- {} +
          cp -a "$work/source/." .
          mkdir -p .github/workflows
          cp "$work/clone-aura.yml" .github/workflows/clone-aura.yml

      - name: Commit and push source copy
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Repository already matches the source."
            exit 0
          fi
          git commit -m "Clone Aura source repository"
          git push
