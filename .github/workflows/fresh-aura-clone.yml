name: Fresh Aura Clone

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Branch from the source repository"
        required: true
        default: "main"
        type: string

permissions:
  contents: write

concurrency:
  group: fresh-aura-clone
  cancel-in-progress: false

jobs:
  clone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Clone the source repository
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$SOURCE_BRANCH" https://github.com/luckydev-dev/Aura-Ai-Agent.git /tmp/aura-source

      - name: Replace destination files
        run: |
          set -euo pipefail
          mkdir -p /tmp/keep-workflow
          cp .github/workflows/fresh-aura-clone.yml /tmp/keep-workflow/fresh-aura-clone.yml
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/aura-source/. .
          mkdir -p .github/workflows
          cp /tmp/keep-workflow/fresh-aura-clone.yml .github/workflows/fresh-aura-clone.yml

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
          git add -A
          if git diff --cached --quiet; then
            echo "Destination already matches source."
            exit 0
          fi
          git commit -m "Clone latest Aura source"
          git push --force origin HEAD:main
